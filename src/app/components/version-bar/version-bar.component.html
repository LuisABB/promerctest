<div class="version-bar" role="navigation" aria-label="Versiones del sitio">
  <div class="version-bar__inner">
    <span class="version-bar__label">Diseño</span>
    <div class="version-bar__links">
      @for (version of versions; track version.path) {
        <a
          [routerLink]="version.path"
          routerLinkActive="is-active"
          [attr.aria-current]="null"
        >
          {{ version.label }}
          @if (!version.ready) {
            <span class="version-bar__soon">próx.</span>
          }
        </a>
      }
    </div>
  </div>
</div>
